version: 1
env:
  variables:
    VITE_API_BASE_URL: https://peeyush2006-documind-api.onrender.com

frontend:
  phases:
    preBuild:
      commands:
        - cd frontend && npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**
