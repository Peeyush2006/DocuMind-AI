services:
  - type: web
    name: peeyush2006-documind-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://main.d3sxcjwd3wtri0.amplifyapp.com
